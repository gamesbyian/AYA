name: AYAFileProviderMinimalRepro
options:
  bundleIdPrefix: org.example.aya
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MinimalSource:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SourceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.aya.minfiles.source
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SourceApp/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
  MinimalConsumer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ConsumerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.aya.minfiles.consumer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConsumerApp/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
  MinimalConsumerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ConsumerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.aya.minfiles.consumer.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: MinimalConsumer
schemes:
  MinimalSource:
    build:
      targets:
        MinimalSource: all
  MinimalConsumer:
    build:
      targets:
        MinimalConsumer: all
    test:
      targets:
        - MinimalConsumerUITests
