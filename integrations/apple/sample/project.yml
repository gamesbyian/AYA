name: AYAAppleHost
options:
  bundleIdPrefix: org.example
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  AYAApple:
    path: ../AYAApple
targets:
  AYAAppleHost:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.ayalantern
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/HostInfo.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: AYAApple
        product: AYAApple
  AYAAppleHostUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
      - path: Resources/aya-guide.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.ayalantern.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: AYAAppleHost
schemes:
  AYAAppleHost:
    build:
      targets:
        AYAAppleHost: all
    test:
      targets:
        - AYAAppleHostUITests
