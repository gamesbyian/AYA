group = 'dev.aya.flutter'
version = '0.1.0-dev.1'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'dev.aya.flutter'
    compileSdk 35
    defaultConfig {
        minSdk 23
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Source-preview only: host must supply a compatible staging Maven repo.
    // Do not publish this until a public release is reliably resolvable.
    implementation 'dev.aya:aya-android:0.1.0-SNAPSHOT'
}
