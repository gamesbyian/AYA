name: aya_flutter
description: Optional Android-only Ask Your Agent handoff integration with a user-reviewed native share flow.
version: 0.2.0-dev.1
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: dev.aya.flutter
        pluginClass: AyaFlutterPlugin
