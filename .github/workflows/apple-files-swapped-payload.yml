name: Apple Files swapped-payload identity differential
# Bounded diagnostic; the ordinary real Files negative acceptance stays strict.
on:
  push:
    branches: [test/apple-files-oversize-negative-20261104]
    paths:
      - '.github/workflows/apple-files-swapped-payload.yml'
      - 'integrations/apple/qa-share-receiver/Host/AYAShareQAHostApp.swift'
      - 'integrations/apple/sample/UITests/AYAAppleHostFilesImportUITests.swift'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swapped-content:
    name: Fresh provider / ${{ matrix.case }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [invalid-under-valid-name, valid-under-invalid-name]
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - name: Build separate QA provider and host test project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          ( cd integrations/apple/qa-share-receiver && xcodegen generate )
          ( cd integrations/apple/sample && xcodegen generate )
          xcodebuild -project integrations/apple/qa-share-receiver/AYAShareQA.xcodeproj \
            -scheme AYAShareQAHost -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aya-qa-swap" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/aya-swap-qa-build.log" 2>&1 || {
              tail -80 "$RUNNER_TEMP/aya-swap-qa-build.log"; exit 1;
            }
      - name: Verify byte-swapped seven-file inventory, then select in native Files
        shell: bash
        run: |
          set -euo pipefail
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["identifier"] for x in d["devicetypes"] if x["name"] == "iPhone 16 Pro"))')"
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["identifier"] for x in d["runtimes"] if x.get("isAvailable") and x["identifier"].endswith(".iOS-18-5")))')"
          SIM_ID="$(xcrun simctl create "AYA swap $CASE" "$TYPE" "$RUNTIME")"
          trap 'xcrun simctl shutdown "$SIM_ID" || true; xcrun simctl delete "$SIM_ID" || true' EXIT
          echo "Fresh simulator for $CASE: $SIM_ID"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$RUNNER_TEMP/aya-qa-swap/Build/Products/Debug-iphonesimulator/AYAShareQAHost.app"
          xcrun simctl launch "$SIM_ID" org.example.aya.shareqa --aya-stage-seven-swap-content
          QA_DATA="$(xcrun simctl get_app_container "$SIM_ID" org.example.aya.shareqa data)"
          python3 - "$QA_DATA/Documents" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          valid = b'{"aya_demo_layout":"v1","columns":3,"accent":"cool"}\n'
          invalid = b'{"aya_demo_layout":"v1","columns":99,"accent":"invalid"}\n'
          assert sorted(x.name for x in p.glob("aya-layout-*.json")) == sorted([
              "aya-layout-valid.json", "aya-layout-invalid.json",
              "aya-layout-aaa-control.json", "aya-layout-zzz-invalid.json",
              "aya-layout-boolean.json", "aya-layout-float.json",
              "aya-layout-oversized.json"])
          assert (p / "aya-layout-valid.json").read_bytes() == invalid
          assert (p / "aya-layout-invalid.json").read_bytes() == valid
          assert (p / "aya-layout-aaa-control.json").read_bytes() == valid
          assert (p / "aya-layout-zzz-invalid.json").read_bytes() == invalid
          assert (p / "aya-layout-boolean.json").read_bytes() == b'{"aya_demo_layout":"v1","columns":true,"accent":"cool"}\n'
          assert (p / "aya-layout-float.json").read_bytes() == b'{"aya_demo_layout":"v1","columns":1.0,"accent":"cool"}\n'
          over = (p / "aya-layout-oversized.json").read_bytes()
          assert len(over) == 4194305
          assert over.startswith(valid[:-1])
          assert over[len(valid) - 1:] == b' ' * (len(over) - len(valid) + 1)
          print("QA inventory verified: two identities exchanged, other five unchanged")
          PY
          xcrun simctl terminate "$SIM_ID" org.example.aya.shareqa || true
          if [ "$CASE" = invalid-under-valid-name ]; then
            TEST=testSwappedValidNameWithInvalidPayloadMustReject
          else
            TEST=testSwappedInvalidNameWithValidPayloadMustPreview
          fi
          set +e
          xcodebuild -project integrations/apple/sample/AYAAppleHost.xcodeproj \
            -scheme AYAAppleHost -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/aya-host-swap" \
            -resultBundlePath "$RUNNER_TEMP/aya-swap-$CASE.xcresult" \
            "-only-testing:AYAAppleHostUITests/AYAAppleHostFilesImportUITests/$TEST" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/aya-swap-$CASE.log" 2>&1
          STATUS=$?
          set -e
          grep -E 'error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/aya-swap-$CASE.log" | tail -24 || true
          (
            set +e
            xcrun simctl spawn "$SIM_ID" log show --last 4m --style compact \
              --predicate '(process == "DocumentManager") OR (process == "fileproviderd") OR (subsystem CONTAINS[c] "FileProvider")' \
              2>&1 | tail -c 1000000 > "$RUNNER_TEMP/aya-swap-$CASE-provider.log"
          ) || true
          if [ -s "$RUNNER_TEMP/aya-swap-$CASE-provider.log" ]; then
            python3 scripts/ci/summarize_apple_fileprovider.py \
              "$RUNNER_TEMP/aya-swap-$CASE-provider.log" \
              "$RUNNER_TEMP/aya-swap-$CASE-provider-summary.md" || true
            if [ -s "$RUNNER_TEMP/aya-swap-$CASE-provider-summary.md" ]; then
              cat "$RUNNER_TEMP/aya-swap-$CASE-provider-summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$STATUS"
      - name: Retain exact native picker and provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aya-files-swap-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/aya-swap-*.log
            ${{ runner.temp }}/aya-swap-*.md
            ${{ runner.temp }}/aya-swap-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
