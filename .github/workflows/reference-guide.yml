name: Reference authoring checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate complete fictional guide example
        run: python3 tools/validate_guide.py --strict docs/reference/EXAMPLE_PARCELPAD.md
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
