name: Expo isolated npm-package Android host acceptance
on:
  pull_request:
    paths:
      - 'integrations/expo/aya-expo/**'
      - 'integrations/expo/guide-plugin/**'
      - '.github/workflows/expo-packed-host.yml'
      - 'aya/**'
      - 'tools/verify_android_adapter_apk.py'
      - 'tools/verify_flutter_host_apk.py'
      - 'tools/prepare_expo_packed_host.py'
      - 'tools/test_prepare_expo_packed_host.py'
  push:
    branches: [main]
    paths:
      - 'integrations/expo/aya-expo/**'
      - 'integrations/expo/guide-plugin/**'
      - '.github/workflows/expo-packed-host.yml'
      - 'aya/**'
      - 'tools/verify_android_adapter_apk.py'
      - 'tools/verify_flutter_host_apk.py'
      - 'tools/prepare_expo_packed_host.py'
      - 'tools/test_prepare_expo_packed_host.py'

concurrency:
  group: expo-packed-host-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-packed-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          SDKROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Stage unpublished canonical Android SDK
        run: gradle :aya:publishReleasePublicationToStagingRepository --no-daemon
      - name: Audit the exact-version synthetic host reference
        run: |
          python3 tools/validate_guide.py --strict integrations/expo/aya-expo/ci-host/aya-guide.md
          python3 tools/audit_reference.py integrations/expo/aya-expo/ci-host/aya-guide.md --inventory integrations/expo/aya-expo/ci-host/inventory.json --questions integrations/expo/aya-expo/ci-host/questions.json --strict
      - name: Reject unsafe packed packages and accidental source-linked consumers
        run: python3 -m unittest discover -s tools -p 'test_prepare_expo_packed_host.py'
      - name: Pack both unpublished Expo modules without executing package scripts
        run: |
          mkdir -p "$RUNNER_TEMP/aya-packs"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/aya-packs" ./integrations/expo/aya-expo
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/aya-packs" ./integrations/expo/guide-plugin
      - name: Prepare a bounded, truly out-of-tree consumer from exact tarball contents
        run: |
          python3 tools/prepare_expo_packed_host.py --fixture integrations/expo/aya-expo/ci-host --destination "$RUNNER_TEMP/aya-expo-packed-consumer" --module-tarball "$RUNNER_TEMP/aya-packs/aya-expo-0.1.0-dev.1.tgz" --guide-tarball "$RUNNER_TEMP/aya-packs/aya-expo-guide-0.1.0-dev.1.tgz"
          cd "$RUNNER_TEMP/aya-expo-packed-consumer"
          npm install --no-fund --no-audit
          npm ls aya-expo aya-expo-guide
          node - <<'NODE'
          const path = require('node:path');
          const fs = require('node:fs');
          for (const name of ['aya-expo', 'aya-expo-guide']) {
            const p = require.resolve(name + '/package.json');
            if (!p.startsWith(process.cwd() + path.sep + 'node_modules' + path.sep)) {
              throw Error('Package not installed inside independent consumer: ' + p);
            }
            if (fs.lstatSync(path.dirname(p)).isSymbolicLink()) {
              throw Error('Unexpected symlink to AYA checkout: ' + p);
            }
          }
          NODE
      - name: Run genuine Expo CNG prebuild using packed plugins only
        env:
          CI: '1'
        run: |
          cd "$RUNNER_TEMP/aya-expo-packed-consumer"
          npx expo prebuild --platform android --no-install
          test -s android/app/src/main/assets/aya-guide.md
          cmp android/app/src/main/assets/aya-guide.md "$GITHUB_WORKSPACE/integrations/expo/aya-expo/ci-host/aya-guide.md"
      - name: Compile independent Android consumer against staged native AYA SDK
        env:
          AYA_STAGING_MAVEN: ${{ github.workspace }}/aya/build/staging-maven
        run: |
          HOST="$RUNNER_TEMP/aya-expo-packed-consumer"
          cat > "$HOST/aya-maven.init.gradle" <<'GRADLE'
          def staging = System.getenv('AYA_STAGING_MAVEN')
          if (!staging || !new File(staging).isDirectory()) {
              throw new GradleException("Canonical staged AYA Maven repository missing")
          }
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories.maven {
                  url = settings.uri(staging)
              }
          }
          allprojects {
              repositories.maven { url = uri(staging) }
          }
          GRADLE
          cd "$HOST/android"
          ./gradlew :app:assembleDebug -I ../aya-maven.init.gradle --no-daemon --stacktrace
      - name: Inspect real APK identity, guide, manifest and required DEX classes
        run: |
          APK="$RUNNER_TEMP/aya-expo-packed-consumer/android/app/build/outputs/apk/debug/app-debug.apk"
          GUIDE="$GITHUB_WORKSPACE/integrations/expo/aya-expo/ci-host/aya-guide.md"
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          python3 tools/verify_flutter_host_apk.py --apk "$APK" --guide "$GUIDE" --aapt "$AAPT"
          python3 tools/verify_android_adapter_apk.py --apk "$APK" --class dev.aya.expo.AyaExpoModule --class dev.aya.android.AyaShareSelectionReceiver --class dev.aya.android.AyaFileProvider
          sha256sum "$APK"
          echo 'Packaging evidence only: this is still a synthetic first-party host, not a separate maintainer or a physical-device acceptance test.'
      - uses: actions/upload-artifact@v4
        with:
          name: aya-expo-isolated-packed-host
          path: ${{ runner.temp }}/aya-expo-packed-consumer/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
