name: Flutter Dart and AYA source-contract checks
on:
  pull_request:
    paths:
      - 'integrations/flutter/aya_flutter/android/**'
      - 'integrations/flutter/aya_flutter/lib/**'
      - 'integrations/flutter/aya_flutter/test/**'
      - 'integrations/flutter/aya_flutter/ci-host/**'
      - 'integrations/flutter/aya_flutter/pubspec.yaml'
      - 'integrations/flutter/aya_flutter/analysis_options.yaml'
      - 'integrations/flutter/migration/prepare_host.py'
      - 'integrations/flutter/migration/modern.android.gradle'
      - 'integrations/flutter/migration/modern.pubspec.yaml'
      - 'aya/**'
      - 'tools/component_codegen.py'
      - 'tools/test_component_codegen.py'
      - 'docs/components/examples/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/flutter/aya_flutter/android/**'
      - 'integrations/flutter/aya_flutter/lib/**'
      - 'integrations/flutter/aya_flutter/test/**'
      - 'integrations/flutter/aya_flutter/ci-host/**'
      - 'integrations/flutter/aya_flutter/pubspec.yaml'
      - 'integrations/flutter/aya_flutter/analysis_options.yaml'
      - 'integrations/flutter/migration/prepare_host.py'
      - 'integrations/flutter/migration/modern.android.gradle'
      - 'integrations/flutter/migration/modern.pubspec.yaml'
      - 'aya/**'
      - 'tools/component_codegen.py'
      - 'tools/test_component_codegen.py'
      - 'docs/components/examples/**'
      - '.github/workflows/flutter.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integrations/flutter/aya_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve Flutter source package
        run: flutter pub get
      - name: Compile generated Flutter card and action from AYA component manifests
        working-directory: .
        run: |
          python3 tools/component_codegen.py docs/components/examples/sample-help-card.json --format flutter > integrations/flutter/aya_flutter/lib/aya_generated_card.dart
          python3 tools/component_codegen.py docs/components/examples/sample-help-action.json --format flutter > integrations/flutter/aya_flutter/lib/aya_generated_action.dart
      - name: Analyze Dart widget and bridge API
        run: flutter analyze
      - name: Verify mocked native channel and review-first card
        run: flutter test
      - name: Validate the actual CI host's AYA-RAS reference
        working-directory: .
        run: |
          python3 tools/validate_guide.py --strict integrations/flutter/aya_flutter/ci-host/aya-guide.md
          python3 tools/audit_reference.py integrations/flutter/aya_flutter/ci-host/aya-guide.md --inventory integrations/flutter/aya_flutter/ci-host/inventory.json --questions integrations/flutter/aya_flutter/ci-host/questions.json --strict
          python3 -m unittest discover -s tools -p 'test_verify_flutter_host_apk.py'
      # Two separate native requirements remain in other workflows:
      # flutter-external.yml builds the promoted source from an out-of-tree
      # synthetic consumer, while flutter-builtin-kotlin.yml exercises the
      # migration toolchain. Neither is replaced by Dart-only mocks here.
