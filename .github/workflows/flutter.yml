name: Flutter AYA source-preview checks
on:
  pull_request:
    paths:
      - 'integrations/flutter/**'
      - 'aya/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/flutter/**'
      - 'aya/**'
      - '.github/workflows/flutter.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integrations/flutter/aya_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter source package
        run: flutter pub get
      - name: Analyze Dart widget and bridge API
        run: flutter analyze
      - name: Verify mocked native channel and review-first card
        run: flutter test
      - name: Stage canonical Android SDK Maven AAR/POM
        working-directory: .
        run: gradle :aya:publishReleasePublicationToStagingRepository --no-daemon
      - name: Generate throwaway Flutter Android host with staged AYA SDK
        run: |
          flutter create --project-name aya_flutter_ci_host --platforms android example
          python3 - <<'PY'
          from pathlib import Path

          host = Path("example")
          pub = host / "pubspec.yaml"
          data = pub.read_text()
          needle = "dependencies:\n"
          assert needle in data
          data = data.replace(needle,
              needle + "  aya_flutter:\n    path: ..\n", 1)
          pub.write_text(data)

          settings_kts = host / "android" / "settings.gradle.kts"
          settings_groovy = host / "android" / "settings.gradle"
          if settings_kts.is_file():
              with settings_kts.open("a") as f:
                  f.write("""
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri(rootDir.resolve("../../../../../aya/build/staging-maven")) }
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }
          """)
          elif settings_groovy.is_file():
              with settings_groovy.open("a") as f:
                  f.write("""
          dependencyResolutionManagement {
              repositoriesMode = RepositoriesMode.PREFER_SETTINGS
              repositories {
                  google()
                  mavenCentral()
                  maven { url uri(file("../../../../../aya/build/staging-maven")) }
                  maven { url uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }
          """)
          else:
              raise RuntimeError("Flutter Android host settings missing")
          PY
      - name: Compile actual Flutter Android APK with AYA native bridge
        working-directory: integrations/flutter/aya_flutter/example
        run: |
          flutter pub get
          flutter build apk --debug --no-pub
