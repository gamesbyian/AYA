name: Flutter AYA source-preview checks
on:
  pull_request:
    paths:
      - 'integrations/flutter/**'
      - 'aya/**'
      - 'tools/component_codegen.py'
      - 'tools/test_component_codegen.py'
      - 'docs/components/examples/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/flutter/**'
      - 'aya/**'
      - 'tools/component_codegen.py'
      - 'tools/test_component_codegen.py'
      - 'docs/components/examples/**'
      - '.github/workflows/flutter.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integrations/flutter/aya_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter source package
        run: flutter pub get
      - name: Compile generated Flutter card and action from AYA component manifests
        working-directory: .
        run: |
          python3 tools/component_codegen.py docs/components/examples/sample-help-card.json --format flutter > integrations/flutter/aya_flutter/lib/aya_generated_card.dart
          python3 tools/component_codegen.py docs/components/examples/sample-help-action.json --format flutter > integrations/flutter/aya_flutter/lib/aya_generated_action.dart
      - name: Analyze Dart widget and bridge API
        run: flutter analyze
      - name: Verify mocked native channel and review-first card
        run: flutter test
      - name: Stage canonical Android SDK Maven AAR/POM
        working-directory: .
        run: gradle :aya:publishReleasePublicationToStagingRepository --no-daemon
      - name: Validate the actual CI host's AYA-RAS reference
        working-directory: .
        run: |
          python3 tools/validate_guide.py --strict integrations/flutter/aya_flutter/ci-host/aya-guide.md
          python3 tools/audit_reference.py integrations/flutter/aya_flutter/ci-host/aya-guide.md --inventory integrations/flutter/aya_flutter/ci-host/inventory.json --questions integrations/flutter/aya_flutter/ci-host/questions.json --strict
          python3 -m unittest discover -s tools -p 'test_verify_flutter_host_apk.py'
      - name: Generate throwaway Flutter Android host with staged AYA SDK
        run: |
          flutter create --project-name aya_flutter_ci_host --platforms android example
          python3 - <<'PY'
          from pathlib import Path

          import re
          from shutil import copyfile

          host = Path("example")
          pub = host / "pubspec.yaml"
          data = pub.read_text()
          # Detect changes in generated host identity rather than accidentally
          # packaging a stale reference for a different Flutter template.
          if not re.search(r"(?m)^version:\\s*1\\.0\\.0\\+1\\s*$", data):
              raise RuntimeError("CI host version changed; update and re-review aya-guide.md")
          src = Path("ci-host")
          target = host / "android" / "app" / "src" / "main" / "assets"
          target.mkdir(parents=True, exist_ok=True)
          copyfile(src / "aya-guide.md", target / "aya-guide.md")
          copyfile(src / "main.dart", host / "lib" / "main.dart")
          needle = "dependencies:\n"
          assert needle in data
          data = data.replace(needle,
              needle + "  aya_flutter:\n    path: ..\n", 1)
          pub.write_text(data)

          settings_kts = host / "android" / "settings.gradle.kts"
          settings_groovy = host / "android" / "settings.gradle"
          if settings_kts.is_file():
              with settings_kts.open("a") as f:
                  f.write("""
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri(rootDir.resolve("../../../../../aya/build/staging-maven")) }
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }
          """)
          elif settings_groovy.is_file():
              with settings_groovy.open("a") as f:
                  f.write("""
          dependencyResolutionManagement {
              repositoriesMode = RepositoriesMode.PREFER_SETTINGS
              repositories {
                  google()
                  mavenCentral()
                  maven { url uri(file("../../../../../aya/build/staging-maven")) }
                  maven { url uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }
          """)
          else:
              raise RuntimeError("Flutter Android host settings missing")
          PY
      - name: Compile actual Flutter Android APK with AYA native bridge
        working-directory: integrations/flutter/aya_flutter/example
        run: |
          flutter pub get
          flutter build apk --debug --no-pub
      - name: Verify the host APK's installed guide and merged AYA components
        working-directory: .
        run: |
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT" && test -x "$AAPT"
          python3 tools/verify_flutter_host_apk.py \\
            --apk integrations/flutter/aya_flutter/example/build/app/outputs/flutter-apk/app-debug.apk \\
            --guide integrations/flutter/aya_flutter/ci-host/aya-guide.md \\
            --aapt "$AAPT"
