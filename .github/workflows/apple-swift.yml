name: Apple Swift package

on:
  pull_request:
    paths:
      - 'integrations/apple/AYAApple/Package.swift'
      - 'integrations/apple/AYAApple/Sources/**'
      - 'integrations/apple/AYAApple/Tests/**'
      - 'integrations/apple/AYAApple/Examples/**'
      - 'integrations/apple/sample/**'
      - '.github/workflows/apple-swift.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/apple/AYAApple/Package.swift'
      - 'integrations/apple/AYAApple/Sources/**'
      - 'integrations/apple/AYAApple/Tests/**'
      - 'integrations/apple/AYAApple/Examples/**'
      - 'integrations/apple/sample/**'
      - '.github/workflows/apple-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-swift:
    name: Swift reference contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/apple/AYAApple
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: swift --version
      - name: SwiftPM protocol and approval tests
        run: swift test --parallel

  ios-native-build:
    name: iOS SDK and first-party host build
    needs: portable-swift
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: integrations/apple/AYAApple
    steps:
      - uses: actions/checkout@v4
      - name: Xcode toolchain and package scheme
        run: |
          xcodebuild -version
          xcodebuild -list
      - name: Build real iOS Simulator SDK slice (not a device or receiver test)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme AYAApple \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aya-apple-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/aya-apple-xcodebuild.log"
      - name: Generate native iOS host using XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
          cd ../sample
          xcodegen generate
      - name: Build actual iOS simulator sample host
        run: |
          set -o pipefail
          xcodebuild \
            -project ../sample/AYAAppleHost.xcodeproj \
            -scheme AYAAppleHost \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aya-apple-sample-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/aya-apple-sample-build.log"
      - name: Verify source guide bytes and packaged native identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, plistlib
          root = Path(os.environ["GITHUB_WORKSPACE"])
          app = Path(os.environ["RUNNER_TEMP"]) / "aya-apple-sample-derived/Build/Products/Debug-iphonesimulator/AYAAppleHost.app"
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "org.example.ayalantern", info
          assert info["CFBundleShortVersionString"] == "1.0.0", info
          guide = (root / "integrations/apple/sample/Resources/aya-guide.md").read_bytes()
          packaged = (app / "aya-guide.md").read_bytes()
          assert packaged == guide, "packaged iOS AYA guide does not match source"
          print(f"Verified {app.name} bundle ID, installed version and {len(guide)} exact guide bytes")
          PY
      - name: Build disposable external Share Extension for genuine receipt tests
        run: |
          set -o pipefail
          cd ../qa-share-receiver
          xcodegen generate
          xcodebuild -project AYAShareQA.xcodeproj -scheme AYAShareQAHost \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aya-share-qa-derived" \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/aya-share-qa-build.log"
          test -d "$RUNNER_TEMP/aya-share-qa-derived/Build/Products/Debug-iphonesimulator/AYAShareQAHost.app/PlugIns/AYAShareQAExtension.appex"
      - name: Install, launch, and UI-test a genuine iOS Simulator host
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((v["udid"] for arr in d["devices"].values() for v in arr if v.get("isAvailable") and v.get("name","").startswith("iPhone")), ""))')"
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator runtime" >&2
            exit 2
          fi
          echo "Testing native AYA sample on simulator $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          APP="$RUNNER_TEMP/aya-apple-sample-derived/Build/Products/Debug-iphonesimulator/AYAAppleHost.app"
          RECEIVER="$RUNNER_TEMP/aya-share-qa-derived/Build/Products/Debug-iphonesimulator/AYAShareQAHost.app"
          xcrun simctl install "$SIM_ID" "$RECEIVER"
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl launch "$SIM_ID" org.example.ayalantern
          set -o pipefail
          xcodebuild \
            -project ../sample/AYAAppleHost.xcodeproj \
            -scheme AYAAppleHost \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/aya-apple-sample-derived" \
            -resultBundlePath "$RUNNER_TEMP/aya-apple-ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/aya-apple-ui-test.log"
      - name: Verify iPad review controls at accessibility text size
        run: |
          set -euo pipefail
          IPAD_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((v["udid"] for arr in data["devices"].values() for v in arr if v.get("isAvailable") and v.get("name","").startswith("iPad")), ""))')"
          if [ -z "$IPAD_ID" ]; then
            echo "No available iPad simulator; cannot claim iPad UI acceptance" >&2
            exit 2
          fi
          xcrun simctl boot "$IPAD_ID" || true
          xcrun simctl bootstatus "$IPAD_ID" -b
          set -o pipefail
          xcodebuild \
            -project ../sample/AYAAppleHost.xcodeproj \
            -scheme AYAAppleHost \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/aya-apple-sample-derived" \
            -resultBundlePath "$RUNNER_TEMP/aya-apple-ipad-ui.xcresult" \
            -only-testing:AYAAppleHostUITests/AYAAppleHostUITests/testLargeTypeReviewActionsRemainReachable \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/aya-apple-ipad-ui-test.log"
          grep -q "testLargeTypeReviewActionsRemainReachable" "$RUNNER_TEMP/aya-apple-ipad-ui-test.log"
          grep -Eq "Executed 1 test, with 0 failures" "$RUNNER_TEMP/aya-apple-ipad-ui-test.log"
      - name: Retain bounded build diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-xcodebuild-failure
          path: |
            ${{ runner.temp }}/aya-apple-xcodebuild.log
            ${{ runner.temp }}/aya-apple-sample-build.log
            ${{ runner.temp }}/aya-apple-ui-test.log
            ${{ runner.temp }}/aya-share-qa-build.log
            ${{ runner.temp }}/aya-apple-ui.xcresult
            ${{ runner.temp }}/aya-apple-ipad-ui-test.log
            ${{ runner.temp }}/aya-apple-ipad-ui.xcresult
          if-no-files-found: ignore
          retention-days: 7
