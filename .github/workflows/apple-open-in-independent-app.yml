name: Apple genuine cross-app Open In handoff
# One bounded native acceptance run of a real separately installed source app.
# This cannot stand in for Files picker acceptance or actual assistant clients.
on:
  push:
    branches: [test/apple-cross-app-open-in-20261107]
    paths:
      - '.github/workflows/apple-open-in-independent-app.yml'
      - 'integrations/apple/qa-share-receiver/Host/**'
      - 'integrations/apple/qa-share-receiver/OpenInUITests/**'
      - 'integrations/apple/qa-share-receiver/project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-open-in:
    name: Two installed iOS apps, user-mediated document handoff
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Identify toolchain and generate separate Xcode projects
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          (cd integrations/apple/sample && xcodegen generate)
          (cd integrations/apple/qa-share-receiver && xcodegen generate)

      - name: Build the importing sample from this exact checkout
        run: |
          set -euo pipefail
          xcodebuild -project integrations/apple/sample/AYAAppleHost.xcodeproj \
            -scheme AYAAppleHost -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aya-open-in-lantern" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/aya-open-in-lantern-build.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/aya-open-in-lantern-build.log"; exit 1;
            }
          python3 - <<'PY'
          from pathlib import Path
          import os, plistlib
          app = Path(os.environ["RUNNER_TEMP"]) / "aya-open-in-lantern/Build/Products/Debug-iphonesimulator/AYAAppleHost.app"
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "org.example.ayalantern"
          assert info.get("LSSupportsOpeningDocumentsInPlace") is True
          kinds = info.get("CFBundleDocumentTypes", [])
          assert len(kinds) == 1
          assert kinds[0]["LSItemContentTypes"] == ["public.json"]
          assert kinds[0]["CFBundleTypeRole"] == "Viewer"
          print("Independent destination declares alternate JSON Viewer on disk")
          PY

      - name: Boot iPhone, install two apps, test actual user source and destination
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((v["udid"] for a in d["devices"].values() for v in a if v.get("isAvailable") and v["name"].startswith("iPhone")), ""))')"
          test -n "$SIM_ID"
          echo "Open In acceptance simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          AYA_APP="$RUNNER_TEMP/aya-open-in-lantern/Build/Products/Debug-iphonesimulator/AYAAppleHost.app"
          xcrun simctl install "$SIM_ID" "$AYA_APP"
          xcrun simctl launch "$SIM_ID" org.example.ayalantern
          xcrun simctl terminate "$SIM_ID" org.example.ayalantern || true
          set -o pipefail
          xcodebuild -project integrations/apple/qa-share-receiver/AYAShareQA.xcodeproj \
            -scheme AYAShareQAHost -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/aya-open-in-source" \
            -resultBundlePath "$RUNNER_TEMP/aya-open-in-source.xcresult" \
            -only-testing:AYAShareQAOpenInUITests/AYAQAOpenInUITests/testForeignDocumentRequiresPreviewCancelAndApply \
            -only-testing:AYAShareQAOpenInUITests/AYAQAOpenInUITests/testForeignInvalidDocumentNeverOffersApply \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/aya-open-in-source-test.log"
          grep -Eq "Executed 2 tests, with 0 failures" "$RUNNER_TEMP/aya-open-in-source-test.log"
          echo "Actual foreign-app activity UI and destination callback qualified on $SIM_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve native evidence if real handoff does not complete
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-external-open-in-native-failure
          path: |
            ${{ runner.temp }}/aya-open-in-*.log
            ${{ runner.temp }}/aya-open-in-source.xcresult
          if-no-files-found: ignore
          retention-days: 7
