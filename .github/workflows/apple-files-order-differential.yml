name: Apple Files item creation-order differential
on:
  pull_request:
    paths:
      - '.github/workflows/apple-files-order-differential.yml'
      - 'integrations/apple/qa-share-receiver/Host/AYAShareQAHostApp.swift'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creation-order:
    name: Fresh provider / ${{ matrix.case }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [invalid-first, invalid-last]
    env:
      CONTROL_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate and build independent native QA provider
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          ( cd integrations/apple/qa-share-receiver && xcodegen generate )
          ( cd integrations/apple/sample && xcodegen generate )
          xcodebuild -project integrations/apple/qa-share-receiver/AYAShareQA.xcodeproj \
            -scheme AYAShareQAHost -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aya-qa-order" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/aya-qa-order-build.log" 2>&1 || {
              tail -90 "$RUNNER_TEMP/aya-qa-order-build.log"; exit 1;
            }
      - name: Validate exact same seven document bytes, then one native picker journey
        shell: bash
        run: |
          set -euo pipefail
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["identifier"] for x in d["devicetypes"] if x["name"] == "iPhone 16 Pro"))')"
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["identifier"] for x in d["runtimes"] if x.get("isAvailable") and x["identifier"].endswith(".iOS-18-5")))')"
          SIM_ID="$(xcrun simctl create "AYA order $CONTROL_CASE" "$TYPE" "$RUNTIME")"
          echo "Fresh $CONTROL_CASE iPhone simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$RUNNER_TEMP/aya-qa-order/Build/Products/Debug-iphonesimulator/AYAShareQAHost.app"
          xcrun simctl launch "$SIM_ID" org.example.aya.shareqa "--aya-stage-seven-$CONTROL_CASE"
          QA_DATA="$(xcrun simctl get_app_container "$SIM_ID" org.example.aya.shareqa data)"
          # Check *every* synthetic fixture's bytes, not just item count:
          # creation sequence must be the only difference under test.
          python3 - "$QA_DATA/Documents" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          cases = {
              'valid': (3, 'cool'),
              'invalid': (99, 'invalid'),
              'boolean': (True, 'cool'),
              'float': (1.0, 'cool'),
              'aaa-control': (3, 'cool'),
              'zzz-invalid': (99, 'invalid'),
          }
          files = sorted(root.glob("aya-layout-*.json"))
          assert len(files) == 7, [p.name for p in files]
          for stem, (columns, accent) in cases.items():
              p = root / f'aya-layout-{stem}.json'
              content = p.read_bytes()
              expected = ('{"aya_demo_layout":"v1","columns":' +
                          ('true' if columns is True else '1.0' if isinstance(columns, float) else str(columns)) +
                          ',"accent":"' + accent + '"}\n').encode('utf-8')
              assert content == expected, (p.name, len(content), len(expected))
          oversized = (root / 'aya-layout-oversized.json').read_bytes()
          assert len(oversized) == 4 * 1024 * 1024 + 1
          assert oversized.startswith(b'{"aya_demo_layout":"v1","columns":3,"accent":"cool"}')
          assert oversized[len(b'{"aya_demo_layout":"v1","columns":3,"accent":"cool"}'):] == (
              b' ' * (len(oversized) - len(b'{"aya_demo_layout":"v1","columns":3,"accent":"cool"}')))
          print("All seven fixture names, byte contents and size cap verified.")
          PY
          xcrun simctl terminate "$SIM_ID" org.example.aya.shareqa || true
          set +e
          xcodebuild -project integrations/apple/sample/AYAAppleHost.xcodeproj \
            -scheme AYAAppleHost -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/aya-host-order" \
            -resultBundlePath "$RUNNER_TEMP/aya-order-$CONTROL_CASE.xcresult" \
            "-only-testing:AYAAppleHostUITests/AYAAppleHostFilesImportUITests/testMalformedForeignJSONNeverAuthorizesApply" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/aya-order-$CONTROL_CASE.log" 2>&1
          STATUS=$?
          set -e
          grep -E 'error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/aya-order-$CONTROL_CASE.log" | tail -24 || true
          (
            set +e
            xcrun simctl spawn "$SIM_ID" log show --last 4m --style compact \
              --predicate '(process == "DocumentManager") OR (process == "fileproviderd") OR (subsystem CONTAINS[c] "FileProvider")' \
              2>&1 | tail -c 1000000 > "$RUNNER_TEMP/aya-order-$CONTROL_CASE-provider.log"
          ) || true
          if [ -s "$RUNNER_TEMP/aya-order-$CONTROL_CASE-provider.log" ]; then
            python3 scripts/ci/summarize_apple_fileprovider.py \
              "$RUNNER_TEMP/aya-order-$CONTROL_CASE-provider.log" \
              "$RUNNER_TEMP/aya-order-$CONTROL_CASE-provider-summary.md" || true
            if [ -s "$RUNNER_TEMP/aya-order-$CONTROL_CASE-provider-summary.md" ]; then
              cat "$RUNNER_TEMP/aya-order-$CONTROL_CASE-provider-summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          xcrun simctl shutdown "$SIM_ID" || true
          xcrun simctl delete "$SIM_ID" || true
          exit "$STATUS"
      - name: Retain native Files selection and provider logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aya-files-order-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/aya-order-*.log
            ${{ runner.temp }}/aya-order-*.md
            ${{ runner.temp }}/aya-order-*.xcresult
            ${{ runner.temp }}/aya-qa-order-build.log
          if-no-files-found: ignore
          retention-days: 7
