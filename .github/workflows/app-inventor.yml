name: MIT App Inventor Rush 2 AYA source extension
on:
  pull_request:
    paths:
      - 'integrations/app-inventor/**'
      - 'aya/**'
      - 'tools/test_app_inventor_adapter.py'
      - 'tools/test_verify_appinventor_aix.py'
      - 'tools/verify_appinventor_aix.py'
      - '.github/workflows/app-inventor.yml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
  push:
    branches: [main]
    paths:
      - 'integrations/app-inventor/**'
      - 'aya/**'
      - 'tools/test_app_inventor_adapter.py'
      - 'tools/test_verify_appinventor_aix.py'
      - 'tools/verify_appinventor_aix.py'
      - '.github/workflows/app-inventor.yml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'

concurrency:
  group: aya-appinventor-aix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-aix-source-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on source, guide, AIX native shape and handoff boundaries
        run: |
          python3 -m unittest discover -s tools -p 'test_app_inventor_adapter.py'
          python3 -m unittest discover -s tools -p 'test_verify_appinventor_aix.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android platform for canonical AYA core build
        run: |
          SDKROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile canonical AYA debug AAR, never substitute a copied binary
        run: gradle :aya:assembleDebug --no-daemon --stacktrace
      - name: Stage exact compiled AAR into disposable Rush source project
        run: |
          SOURCE=aya/build/outputs/aar/aya-debug.aar
          DEST=integrations/app-inventor/aya-rush/deps
          test -s "$SOURCE"
          unzip -p "$SOURCE" classes.jar > "$RUNNER_TEMP/aya-appinventor-classes.jar"
          test -s "$RUNNER_TEMP/aya-appinventor-classes.jar"
          javap -classpath "$RUNNER_TEMP/aya-appinventor-classes.jar" 'dev.aya.android.AyaComponentAction$Help'
          mkdir -p "$DEST"
          cp "$SOURCE" "$DEST/aya-debug.aar"
          sha256sum "$DEST/aya-debug.aar"
      - name: Install explicitly pinned Rush 2.1.2 extension builder
        uses: shreyashsaitwal/rush-cli@8d9d79cc0573ac01bf56cb676ddf476323e10385
        with:
          version: 2.1.2
      - name: Build real unpublished App Inventor v206 extension AIX
        working-directory: integrations/app-inventor/aya-rush
        run: |
          rush --version
          # Fresh runners have no App Inventor v206 runtime; Rush's setup
          # action installs the CLI, not the 140 MB compiler/runtime bundle.
          rush deps sync --dev-deps
          rush deps tree
          rush build
          find out -type f -maxdepth 2 -print
          python3 ../../../tools/verify_appinventor_aix.py \
            --aix out/dev.aya.appinventor.aix
      - name: Preserve unpublished AIX and generated blocks reference
        uses: actions/upload-artifact@v4
        with:
          name: aya-appinventor-rush2-source-preview
          path: integrations/app-inventor/aya-rush/out/
          if-no-files-found: error
          retention-days: 7
