name: Unity bridge inside first-party Android APK
on:
  pull_request:
    paths:
      - 'aya-unity/**'
      - 'aya/**'
      - 'sample/**'
      - 'tools/verify_android_adapter_apk.py'
      - 'tools/verify_flutter_host_apk.py'
      - '.github/workflows/unity-apk.yml'
  push:
    branches: [main]
    paths:
      - 'aya-unity/**'
      - 'aya/**'
      - 'sample/**'
      - 'tools/verify_android_adapter_apk.py'
      - 'tools/verify_flutter_host_apk.py'
      - '.github/workflows/unity-apk.yml'

concurrency:
  group: aya-unity-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-package-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDKROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Audit existing sample's exact-version host guide
        run: |
          python3 tools/validate_guide.py --strict sample/src/main/assets/aya-guide.md
      - name: Inject Unity native AAR dependency into a throwaway sample Gradle invocation
        run: |
          cat > "$RUNNER_TEMP/aya-unity-sample.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              if (project.path == ':sample') {
                  project.plugins.withId('com.android.application') {
                      project.dependencies.add('implementation', project.project(':aya-unity'))
                  }
              }
          }
          GRADLE
          gradle :sample:assembleDebug -I "$RUNNER_TEMP/aya-unity-sample.init.gradle" --no-daemon --stacktrace
      - name: Inspect resulting APK guide, native receiver, and compiled Unity bridge
        run: |
          APK=sample/build/outputs/apk/debug/sample-debug.apk
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          python3 tools/verify_flutter_host_apk.py --apk "$APK" --guide sample/src/main/assets/aya-guide.md --aapt "$AAPT"
          python3 tools/verify_android_adapter_apk.py --apk "$APK" --class dev.aya.unity.AyaUnityBridge --class dev.aya.android.AyaShareSelectionReceiver
          sha256sum "$APK"
          echo 'Synthetic Android packaging only; this does not establish Unity Editor import or Unity-generated Android exports.'
