name: Android library and consumer integration
on:
  push:
    branches: [main]
    paths:
      - 'aya/**'
      - 'aya-compose/**'
      - 'sample/**'
      - 'tools/component_codegen.py'
      - 'tools/component_scaffold.py'
      - 'tools/test_component_codegen.py'
      - 'tools/test_component_scaffold.py'
      - 'tools/validate_staged_maven.py'
      - 'tools/test_validate_staged_maven.py'
      - 'docs/components/examples/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'aya/**'
      - 'aya-compose/**'
      - 'sample/**'
      - 'tools/component_codegen.py'
      - 'tools/component_scaffold.py'
      - 'tools/test_component_codegen.py'
      - 'tools/test_component_scaffold.py'
      - 'tools/validate_staged_maven.py'
      - 'tools/test_validate_staged_maven.py'
      - 'docs/components/examples/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          SDKROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile a generated AYA component in the real Android sample
        run: |
          { echo 'package dev.aya.sample'; echo; python3 tools/component_codegen.py docs/components/examples/sample-help-card.json --format kotlin; } > sample/src/main/java/dev/aya/sample/AyaGeneratedComponent.kt
          { echo 'package dev.aya.sample'; echo; python3 tools/component_codegen.py docs/components/examples/sample-help-action.json --format kotlin; } > sample/src/main/java/dev/aya/sample/AyaGeneratedAction.kt
          { echo 'package dev.aya.sample'; echo; python3 tools/component_codegen.py docs/components/examples/sample-help-card.json --format compose; } > sample/src/main/java/dev/aya/sample/AyaGeneratedComposeCard.kt
          { echo 'package dev.aya.sample'; echo; python3 tools/component_codegen.py docs/components/examples/sample-help-action.json --format compose; } > sample/src/main/java/dev/aya/sample/AyaGeneratedComposeAction.kt
      - name: Compile a generated XML card in the real sample app
        run: python3 tools/component_codegen.py docs/components/examples/sample-help-card.json --format android-xml > sample/src/main/res/layout/aya_generated_xml_card.xml
      - name: Safely scaffold Kotlin and XML cards in the consuming sample
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('docs/components/examples/sample-help-card.json').read_text())
          m['id'] = 'sample.help.scaffolder.smoke'
          Path('/tmp/aya-scaffold-smoke.json').write_text(json.dumps(m))
          PY
          python3 tools/component_scaffold.py --project-dir . --module sample --manifest /tmp/aya-scaffold-smoke.json --mode kotlin --package dev.aya.sample --apply
          python3 tools/component_scaffold.py --project-dir . --module sample --manifest /tmp/aya-scaffold-smoke.json --mode android-xml --apply
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('docs/components/examples/sample-help-card.json').read_text())
          m['id'] = 'sample.help.scaffolder.compose.smoke'
          Path('/tmp/aya-scaffold-compose-smoke.json').write_text(json.dumps(m))
          PY
          python3 tools/component_scaffold.py --project-dir . --module sample --manifest /tmp/aya-scaffold-compose-smoke.json --mode compose --package dev.aya.sample --apply
      - name: Unit tests and module-based consumer
        run: gradle :aya:testDebugUnitTest :aya:assembleDebug :aya:assembleDebugAndroidTest :aya-compose:assembleDebug :sample:assembleDebug --no-daemon
      - name: Produce Maven-style library distribution
        run: gradle :aya:publishReleasePublicationToStagingRepository :aya-compose:publishReleasePublicationToStagingRepository --no-daemon
      - name: Verify sample consumes published AAR and POM dependencies
        run: gradle :sample:assembleDebug -Paya.consumePublished=true --no-daemon --refresh-dependencies
      - name: Exercise non-SNAPSHOT staged Maven coordinates
        run: |
          gradle :aya:publishReleasePublicationToStagingRepository :aya-compose:publishReleasePublicationToStagingRepository -Paya.version=0.1.0-preview.1 --no-daemon
          python3 -m unittest discover -s tools -p 'test_validate_staged_maven.py'
          python3 tools/validate_staged_maven.py --root aya/build/staging-maven --version 0.1.0-preview.1 --checksum-output aya-staging-sha256.txt
          gradle :sample:assembleDebug -Paya.consumePublished=true -Paya.version=0.1.0-preview.1 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aya-sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aya-maven-staging-repository
          path: aya/build/staging-maven/
          if-no-files-found: error
