name: Apple Files source-process lifetime comparison
# Standalone OS diagnostic; never replaces full native Files picker acceptance.
on:
  push:
    branches: [test/apple-files-oversize-negative-20261104]
    paths:
      - '.github/workflows/apple-files-provider-lifetime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-lifetime:
    name: Fresh source / ${{ matrix.case }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [terminate-source, background-source]
    env:
      MODE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - name: Build separate, native test provider
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          ( cd integrations/apple/qa-share-receiver && xcodegen generate )
          ( cd integrations/apple/sample && xcodegen generate )
          xcodebuild -project integrations/apple/qa-share-receiver/AYAShareQA.xcodeproj \
            -scheme AYAShareQAHost -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/aya-lifetime-qa" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/aya-lifetime-qa-build.log" 2>&1 || {
              tail -80 "$RUNNER_TEMP/aya-lifetime-qa-build.log"; exit 1;
            }
      - name: Compare lifetime with same seven provider files and exact rejection
        shell: bash
        run: |
          set -euo pipefail
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["identifier"] for x in d["devicetypes"] if x["name"] == "iPhone 16 Pro"))')"
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["identifier"] for x in d["runtimes"] if x.get("isAvailable") and x["identifier"].endswith(".iOS-18-5")))')"
          SIM_ID="$(xcrun simctl create "AYA lifetime $MODE" "$TYPE" "$RUNTIME")"
          trap 'xcrun simctl shutdown "$SIM_ID" || true; xcrun simctl delete "$SIM_ID" || true' EXIT
          echo "Fresh native provider test: $SIM_ID / $MODE"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$RUNNER_TEMP/aya-lifetime-qa/Build/Products/Debug-iphonesimulator/AYAShareQAHost.app"
          xcrun simctl launch "$SIM_ID" org.example.aya.shareqa --aya-stage-fixtures
          QA="$(xcrun simctl get_app_container "$SIM_ID" org.example.aya.shareqa data)"
          python3 - "$QA/Documents" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          wanted = {
              "valid": b'{"aya_demo_layout":"v1","columns":3,"accent":"cool"}\n',
              "invalid": b'{"aya_demo_layout":"v1","columns":99,"accent":"invalid"}\n',
              "boolean": b'{"aya_demo_layout":"v1","columns":true,"accent":"cool"}\n',
              "float": b'{"aya_demo_layout":"v1","columns":1.0,"accent":"cool"}\n',
              "aaa-control": b'{"aya_demo_layout":"v1","columns":3,"accent":"cool"}\n',
              "zzz-invalid": b'{"aya_demo_layout":"v1","columns":99,"accent":"invalid"}\n',
          }
          actual = sorted(q.name for q in p.glob("aya-layout-*.json"))
          assert actual == sorted([f"aya-layout-{stem}.json" for stem in wanted] +
                                  ["aya-layout-oversized.json"]), actual
          for stem, payload in wanted.items():
              assert (p / f"aya-layout-{stem}.json").read_bytes() == payload
          oversized = (p / "aya-layout-oversized.json").read_bytes()
          prefix = wanted["valid"][:-1]
          assert len(oversized) == 4194305
          assert oversized.startswith(prefix)
          assert oversized[len(prefix):] == b' ' * (len(oversized) - len(prefix))
          print("Seven exact filenames/payloads match across process-lifetime controls")
          PY
          if [ "$MODE" = terminate-source ]; then
            xcrun simctl terminate "$SIM_ID" org.example.aya.shareqa
            echo "QA source explicitly terminated before Files picker"
          else
            echo "QA source left running; XCTest's host launch backgrounds it"
          fi
          set +e
          xcodebuild -project integrations/apple/sample/AYAAppleHost.xcodeproj \
            -scheme AYAAppleHost -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/aya-lifetime-host" \
            -resultBundlePath "$RUNNER_TEMP/aya-lifetime-$MODE.xcresult" \
            "-only-testing:AYAAppleHostUITests/AYAAppleHostFilesImportUITests/testMalformedForeignJSONNeverAuthorizesApply" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/aya-lifetime-$MODE.log" 2>&1
          STATUS=$?
          set -e
          grep -E 'error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/aya-lifetime-$MODE.log" | tail -24 || true
          (
            set +e
            xcrun simctl spawn "$SIM_ID" log show --last 4m --style compact \
              --predicate '(process == "DocumentManager") OR (process == "fileproviderd") OR (subsystem CONTAINS[c] "FileProvider")' \
              2>&1 | tail -c 1000000 > "$RUNNER_TEMP/aya-lifetime-$MODE-provider.log"
          ) || true
          if [ -s "$RUNNER_TEMP/aya-lifetime-$MODE-provider.log" ]; then
            python3 scripts/ci/summarize_apple_fileprovider.py \
              "$RUNNER_TEMP/aya-lifetime-$MODE-provider.log" \
              "$RUNNER_TEMP/aya-lifetime-$MODE-provider-summary.md" || true
            if [ -s "$RUNNER_TEMP/aya-lifetime-$MODE-provider-summary.md" ]; then
              cat "$RUNNER_TEMP/aya-lifetime-$MODE-provider-summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$STATUS"
      - name: Retain native rejection and File Provider diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aya-files-lifetime-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/aya-lifetime-*.log
            ${{ runner.temp }}/aya-lifetime-*.md
            ${{ runner.temp }}/aya-lifetime-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
