name: AYA Expo guide prebuild source checks
on:
  push:
    branches: [main]
    paths:
      - 'integrations/expo/guide-plugin/**'
      - '.github/workflows/expo-guide.yml'
  pull_request:
    paths:
      - 'integrations/expo/guide-plugin/**'
      - '.github/workflows/expo-guide.yml'

concurrency:
  group: aya-expo-guide-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fail-closed guide packaging behavior
        run: node --test integrations/expo/guide-plugin/test/*.test.cjs
