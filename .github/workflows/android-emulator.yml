name: Android emulator handoff and question flow
on:
  pull_request:
    paths:
      - "aya/**"
      - "sample/**"
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

concurrency:
  group: aya-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable Linux KVM hardware acceleration when available
        run: sudo chmod a+rw /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :aya:connectedDebugAndroidTest :sample:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Preserve Android UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-evidence
          path: |
            aya/build/outputs/androidTest-results/connected/
            sample/build/outputs/androidTest-results/connected/
            sample/build/reports/androidTests/connected/
          if-no-files-found: ignore
