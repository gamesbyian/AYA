<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 1248" role="img" aria-labelledby="title desc">
  <title id="title">Ask Your Agent icon</title>
  <desc id="desc">A tilted phone displaying settings, a question bubble pointing to the phone, and an AI sparkle bubble pointing outward.</desc>
  <!-- Monochrome vector artwork. Switch the black background and white ink to recolor. -->
  <rect width="1248" height="1248" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Phone, tilted counterclockwise, with screen and settings controls. -->
    <g id="phone" transform="rotate(-10 415 620)">
      <rect x="214" y="208" width="422" height="844" rx="55"/>
      <rect x="248" y="298" width="355" height="630" rx="16"/>
      <path d="M360 260h126M388 1006h74"/>
      <g id="settings-gear" transform="translate(427 571)">
        <path d="M-29-139h58l8 30q17 5 33 17l27-15 40 41-16 28q11 16 16 33l31 8v57l-31 8q-5 18-17 34l16 27-40 41-28-16q-15 11-32 16l-8 31h-58l-8-31q-18-5-33-17l-27 16-41-41 16-28q-12-15-17-33l-30-8v-57l30-8q5-17 17-33l-16-28 41-41 28 16q15-12 33-17z" transform="scale(.78)"/>
        <circle r="64"/>
      </g>
      <path d="M307 774h218M307 837h189"/>
    </g>
    <!-- Question: the tail points back toward the phone. -->
    <g id="question-bubble">
      <path fill="#000" d="M739 251h258c45 0 80 35 80 79v145c0 45-35 79-80 79H746c-45 0-75-29-75-74v-5l-71-57 71-62v-25c0-45 28-80 68-80z"/>
    </g>
    <!-- AI assistant: its speech-bubble tail points right, away from the app. -->
    <g id="ai-bubble">
      <path fill="#000" d="M675 705h188c75 0 132 54 132 123v20l72 53-72 59c-6 54-53 83-114 83H679c-69 0-119-44-119-109v-119c0-65 48-110 115-110z"/>
    </g>
    <!-- Outward emphasis marks. -->
    <g id="emphasis">
      <path d="M985 606l-34 70M1073 653l-62 65M1110 765l-67 16"/>
    </g>
    <!-- Two four-point AI sparkles. -->
    <g id="sparkles">
      <path d="M748 793c17 57 39 80 93 98-54 18-76 41-93 98-18-57-40-80-94-98 54-18 76-41 94-98z"/>
      <path d="M870 766c8 24 19 34 43 42-24 8-35 18-43 43-8-25-19-35-43-43 24-8 35-18 43-42z"/>
    </g>
  </g>
  <!-- Centered, rounded technical question mark, drawn as a path rather than a font. -->
  <g id="question-mark" fill="none" stroke="#fff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <path d="M813 349c0-39 27-62 62-62 38 0 67 24 67 59 0 24-13 38-36 54-19 13-30 26-30 45"/>
    <circle cx="876" cy="493" r="17" fill="#fff" stroke="none"/>
  </g>
</svg>
